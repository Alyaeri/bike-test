<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SM-120 Telemetry</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: white;
    max-width: 700px;
    margin: auto;
    padding: 24px;
  }

  button {
    width: 100%;
    padding: 18px;
    margin: 8px 0;
    font-size: 20px;
    font-weight: bold;
    border: 0;
    border-radius: 12px;
  }

  #connect {
    background: white;
    color: black;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }

  .stat {
    background: #222;
    border-radius: 12px;
    padding: 16px;
  }

  .label {
    opacity: 0.6;
    font-size: 14px;
  }

  .value {
    font-size: 32px;
    font-weight: bold;
    margin-top: 4px;
  }

  .raw-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 28px;
  }

  .copy {
    width: auto;
    padding: 8px 14px;
    margin: 0;
    font-size: 14px;
    background: #333;
    color: white;
  }

  pre {
    background: #222;
    padding: 12px;
    border-radius: 8px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 350px;
    overflow-y: auto;
    font-size: 12px;
  }
</style>
</head>

<body>

<h1>🚲 SM-120 Telemetry</h1>

<button id="connect">CONNECT TO BIKE</button>

<div id="status">Not connected</div>

<div class="grid">

  <div class="stat">
    <div class="label">CADENCE</div>
    <div class="value" id="rpm">—</div>
  </div>

  <div class="stat">
    <div class="label">SPEED</div>
    <div class="value" id="speed">—</div>
  </div>

  <div class="stat">
    <div class="label">POWER</div>
    <div class="value" id="power">—</div>
  </div>

  <div class="stat">
    <div class="label">DISTANCE</div>
    <div class="value" id="distance">—</div>
  </div>

  <div class="stat">
    <div class="label">ENERGY</div>
    <div class="value" id="energy">—</div>
  </div>

  <div class="stat">
    <div class="label">ELAPSED</div>
    <div class="value" id="elapsed">—</div>
  </div>

</div>

<div class="raw-header">

  <h2>Diagnostic Log</h2>

  <button class="copy" id="copy">
    COPY
  </button>

</div>

<pre id="log">Waiting...</pre>


<script>

const FTMS =
  "00001826-0000-1000-8000-00805f9b34fb";

const BIKE_DATA =
  "00002ad2-0000-1000-8000-00805f9b34fb";

const FEATURES =
  "00002acc-0000-1000-8000-00805f9b34fb";

const RESISTANCE_RANGE =
  "00002ad6-0000-1000-8000-00805f9b34fb";

const STATUS =
  "00002ada-0000-1000-8000-00805f9b34fb";

const CONTROL_POINT =
  "00002ad9-0000-1000-8000-00805f9b34fb";


const logEl =
  document.getElementById("log");

const statusEl =
  document.getElementById("status");


function log(message) {

  logEl.textContent +=
    message + "\n";

  logEl.scrollTop =
    logEl.scrollHeight;

  console.log(message);
}


function hex(buffer) {

  return [...new Uint8Array(buffer)]
    .map(x =>
      x.toString(16).padStart(2, "0"))
    .join(" ");
}


function formatTime(seconds) {

  seconds =
    Math.floor(seconds);

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );
}


/*
  Parse FTMS Indoor Bike Data.

  The first two bytes are flags.

  We intentionally decode only fields
  that the packet actually says are present.
*/

function parseBikeData(data) {

  const flags =
    data.getUint16(0, true);

  let offset = 2;


  // -------------------------
  // SPEED
  // -------------------------

  if (!(flags & 0x0001)) {

    if (offset + 2 <= data.byteLength) {

      const speed =
        data.getUint16(offset, true) / 100;

      document.getElementById(
        "speed"
      ).textContent =
        speed.toFixed(1) + " km/h";

      offset += 2;
    }
  }


  // -------------------------
  // AVERAGE SPEED
  // -------------------------

  if (flags & 0x0002) {

    offset += 2;
  }


  // -------------------------
  // CADENCE
  // -------------------------

  if (flags & 0x0004) {

    if (offset + 2 <= data.byteLength) {

      const cadence =
        data.getUint16(offset, true) / 2;

      document.getElementById(
        "rpm"
      ).textContent =
        cadence.toFixed(1);

      offset += 2;
    }
  }


  // -------------------------
  // AVERAGE CADENCE
  // -------------------------

  if (flags & 0x0008) {

    offset += 2;
  }


  // -------------------------
  // TOTAL DISTANCE
  // -------------------------

  if (flags & 0x0010) {

    if (offset + 3 <= data.byteLength) {

      const distance =
        data.getUint8(offset) |
        (data.getUint8(offset + 1) << 8) |
        (data.getUint8(offset + 2) << 16);

      document.getElementById(
        "distance"
      ).textContent =
        (distance / 100).toFixed(2) + " km";

      offset += 3;
    }
  }


  // -------------------------
  // RESISTANCE
  // -------------------------

  if (flags & 0x0020) {

    if (offset + 2 <= data.byteLength) {

      const resistance =
        data.getInt16(offset, true) / 10;

      log(
        "Reported resistance: " +
        resistance
      );

      offset += 2;
    }
  }


  // -------------------------
  // POWER
  // -------------------------

  if (flags & 0x0040) {

    if (offset + 2 <= data.byteLength) {

      const power =
        data.getInt16(offset, true);

      document.getElementById(
        "power"
      ).textContent =
        power + " W";

      offset += 2;
    }
  }


  // -------------------------
  // ENERGY
  // -------------------------

  if (flags & 0x0080) {

    if (offset + 2 <= data.byteLength) {

      const totalEnergy =
        data.getUint16(offset, true);

      document.getElementById(
        "energy"
      ).textContent =
        totalEnergy + " kJ";

      offset += 2;
    }

    /*
      If the More Data flag is set,
      additional energy fields follow.
    */

    if (flags & 0x0100) {

      offset += 2;
    }

    if (flags & 0x0200) {

      offset += 2;
    }
  }


  // -------------------------
  // HEART RATE
  // -------------------------

  if (flags & 0x0400) {

    offset += 1;
  }


  // -------------------------
  // METABOLIC EQUIVALENT
  // -------------------------

  if (flags & 0x0800) {

    offset += 1;
  }


  // -------------------------
  // ELAPSED TIME
  // -------------------------

  if (flags & 0x1000) {

    if (offset + 2 <= data.byteLength) {

      const seconds =
        data.getUint16(offset, true);

      document.getElementById(
        "elapsed"
      ).textContent =
        formatTime(seconds);

      offset += 2;
    }
  }

}


/*
  CONNECT
*/

document.getElementById(
  "connect"
).onclick = async () => {

  try {

    logEl.textContent = "";

    statusEl.textContent =
      "Looking for bike...";


    const device =
      await navigator.bluetooth.requestDevice({

        filters: [
          {
            services: [FTMS]
          }
        ]

      });


    log(
      "Device: " +
      device.name
    );


    statusEl.textContent =
      "Connecting...";


    const server =
      await device.gatt.connect();


    const service =
      await server.getPrimaryService(
        FTMS
      );


    statusEl.textContent =
      "CONNECTED";


    log(
      "FTMS connected."
    );


    // -------------------------
    // FEATURES
    // -------------------------

    try {

      const characteristic =
        await service.getCharacteristic(
          FEATURES
        );

      const value =
        await characteristic.readValue();

      log(
        "FEATURES: " +
        hex(value.buffer)
      );

    } catch (error) {

      log(
        "Features unavailable: " +
        error.message
      );

    }


    // -------------------------
    // RESISTANCE RANGE
    // -------------------------

    try {

      const characteristic =
        await service.getCharacteristic(
          RESISTANCE_RANGE
        );

      const value =
        await characteristic.readValue();


      const minimum =
        value.getInt16(0, true) / 10;

      const maximum =
        value.getInt16(2, true) / 10;

      const increment =
        value.getUint16(4, true) / 10;


      log(
        "RESISTANCE RANGE: " +
        minimum +
        " → " +
        maximum +
        " (" +
        increment +
        " increments)"
      );

    } catch (error) {

      log(
        "Resistance range unavailable: " +
        error.message
      );

    }


    // -------------------------
    // BIKE DATA
    // -------------------------

    const bikeData =
      await service.getCharacteristic(
        BIKE_DATA
      );


    bikeData.addEventListener(
      "characteristicvaluechanged",
      event => {

        const data =
          event.target.value;


        parseBikeData(data);


        /*
          Only log every packet if you
          need it later. For now we keep
          the diagnostic log manageable.
        */

      }
    );


    await bikeData.startNotifications();


    log(
      "Live bike data notifications enabled."
    );


    // -------------------------
    // STATUS
    // -------------------------

    try {

      const characteristic =
        await service.getCharacteristic(
          STATUS
        );


      await characteristic
        .startNotifications();


      characteristic.addEventListener(
        "characteristicvaluechanged",
        event => {

          log(
            "STATUS: " +
            hex(
              event.target.value.buffer
            )
          );

        }
      );


      log(
        "Fitness Machine Status enabled."
      );

    } catch (error) {

      log(
        "Status unavailable: " +
        error.message
      );

    }


    // -------------------------
    // CONTROL POINT
    // -------------------------

    try {

      const characteristic =
        await service.getCharacteristic(
          CONTROL_POINT
        );


      log(
        "Control Point detected."
      );

      log(
        "NO CONTROL COMMANDS WILL BE SENT."
      );

    } catch (error) {

      log(
        "Control Point unavailable: " +
        error.message
      );

    }


  } catch (error) {

    statusEl.textContent =
      "Error";

    log(
      error.name +
      ": " +
      error.message
    );

  }

};


/*
  COPY LOG
*/

document.getElementById(
  "copy"
).onclick = async () => {

  try {

    await navigator.clipboard.writeText(
      logEl.textContent
    );

    const button =
      document.getElementById("copy");

    button.textContent =
      "COPIED!";

    setTimeout(() => {

      button.textContent =
        "COPY";

    }, 1500);

  } catch (error) {

    alert(
      "Copy failed: " +
      error.message
    );

  }

};

</script>

</body>
</html>
