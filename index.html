<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SM-120 Live Test</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: white;
    max-width: 700px;
    margin: auto;
    padding: 24px;
  }

  button {
    display: block;
    width: 100%;
    padding: 18px;
    margin: 12px 0;
    font-size: 20px;
    font-weight: bold;
    border: 0;
    border-radius: 12px;
  }

  #connect { background: white; color: black; }

  .stat {
    background: #222;
    border-radius: 12px;
    padding: 16px;
    margin: 10px 0;
  }

  .value {
    font-size: 36px;
    font-weight: bold;
  }

  pre {
    background: #222;
    padding: 12px;
    border-radius: 8px;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>

<body>

<h1>🚲 SM-120 Live Test</h1>

<button id="connect">CONNECT TO BIKE</button>

<div id="status">Not connected</div>

<div class="stat">
  <div>RPM</div>
  <div class="value" id="rpm">—</div>
</div>

<div class="stat">
  <div>Speed</div>
  <div class="value" id="speed">—</div>
</div>

<div class="stat">
  <div>Resistance</div>
  <div class="value" id="resistance">—</div>
</div>

<div class="stat">
  <div>Power</div>
  <div class="value" id="power">—</div>
</div>

<h2>Raw data</h2>
<pre id="log">Waiting...</pre>

<script>

const FTMS = "00001826-0000-1000-8000-00805f9b34fb";
const BIKE_DATA = "00002ad2-0000-1000-8000-00805f9b34fb";
const FEATURES = "00002acc-0000-1000-8000-00805f9b34fb";
const RESISTANCE_RANGE = "00002ad6-0000-1000-8000-00805f9b34fb";
const CONTROL_POINT = "00002ad9-0000-1000-8000-00805f9b34fb";
const STATUS = "00002ada-0000-1000-8000-00805f9b34fb";

const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

function log(text) {
  logEl.textContent += text + "\n";
  console.log(text);
}

function hex(data) {
  return [...new Uint8Array(data)]
    .map(x => x.toString(16).padStart(2, "0"))
    .join(" ");
}

document.getElementById("connect").onclick = async () => {

  try {

    logEl.textContent = "";

    statusEl.textContent = "Looking for bike...";

    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [FTMS] }]
    });

    log("Device: " + device.name);

    statusEl.textContent = "Connecting...";

    const server = await device.gatt.connect();

    const service = await server.getPrimaryService(FTMS);

    statusEl.textContent = "Connected!";

    log("FTMS connected.");

    // -------------------------
    // BIKE DATA
    // -------------------------

    const bikeData =
      await service.getCharacteristic(BIKE_DATA);

    log("Indoor Bike Data found.");

    bikeData.addEventListener(
      "characteristicvaluechanged",
      event => {

        const data = event.target.value;

        const flags = data.getUint16(0, true);

        log(
          "Bike packet: " +
          hex(data.buffer)
        );

        let offset = 2;

        // Instantaneous speed is present unless bit 0 is set.
        if ((flags & 0x0001) === 0 && data.byteLength >= offset + 2) {

          const speed =
            data.getUint16(offset, true) / 100;

          document.getElementById("speed").textContent =
            speed.toFixed(1) + " km/h";

          offset += 2;
        }

        // Cadence present
        if (flags & (1 << 2)) {

          const rpm =
            data.getUint16(offset, true) / 2;

          document.getElementById("rpm").textContent =
            rpm.toFixed(1);

          offset += 2;
        }

        // Resistance present
        if (flags & (1 << 5)) {

          const resistance =
            data.getInt16(offset, true) / 10;

          document.getElementById("resistance").textContent =
            resistance.toFixed(1);

          offset += 2;
        }

        // Power present
        if (flags & (1 << 6)) {

          const power =
            data.getInt16(offset, true);

          document.getElementById("power").textContent =
            power + " W";

          offset += 2;
        }

      }
    );

    await bikeData.startNotifications();

    log("Listening for live bike data...");

    // -------------------------
    // FEATURES
    // -------------------------

    try {

      const feature =
        await service.getCharacteristic(FEATURES);

      const value =
        await feature.readValue();

      log(
        "FEATURES: " +
        hex(value.buffer)
      );

    } catch (e) {

      log(
        "Could not read features: " +
        e.message
      );

    }

    // -------------------------
    // RESISTANCE RANGE
    // -------------------------

    try {

      const range =
        await service.getCharacteristic(RESISTANCE_RANGE);

      const value =
        await range.readValue();

      log(
        "RESISTANCE RANGE: " +
        hex(value.buffer)
      );

    } catch (e) {

      log(
        "Could not read resistance range: " +
        e.message
      );

    }

    // -------------------------
    // CONTROL POINT
    // -------------------------

    try {

      const control =
        await service.getCharacteristic(CONTROL_POINT);

      log("CONTROL POINT FOUND.");

      log(
        "Control properties: " +
        JSON.stringify(control.properties)
      );

    } catch (e) {

      log(
        "Could not access control point: " +
        e.message
      );

    }

  } catch (error) {

    statusEl.textContent =
      "Error: " + error.message;

    log(
      error.name + ": " + error.message
    );
  }
};

</script>

</body>
</html>
