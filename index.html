<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SM-120 Bike Test V2</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: white;
    max-width: 700px;
    margin: auto;
    padding: 24px;
  }

  button {
    display: block;
    width: 100%;
    padding: 18px;
    margin: 12px 0;
    font-size: 20px;
    font-weight: bold;
    border: 0;
    border-radius: 12px;
  }

  button:disabled {
    opacity: 0.35;
  }

  #connect {
    background: white;
    color: black;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .controls button {
    margin: 0;
  }

  .stat {
    background: #222;
    border-radius: 12px;
    padding: 16px;
    margin: 10px 0;
  }

  .value {
    font-size: 36px;
    font-weight: bold;
  }

  .log-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
  }

  #copy {
    width: auto;
    display: inline-block;
    padding: 8px 14px;
    margin: 0;
    font-size: 14px;
  }

  pre {
    background: #222;
    padding: 12px;
    border-radius: 8px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 350px;
    overflow-y: auto;
  }
</style>
</head>

<body>

<h1>🚲 SM-120 Bike Test V2</h1>

<button id="connect">CONNECT TO BIKE</button>

<div id="status">Not connected</div>

<div class="stat">
  <div>RPM</div>
  <div class="value" id="rpm">—</div>
</div>

<div class="stat">
  <div>Speed</div>
  <div class="value" id="speed">—</div>
</div>

<div class="stat">
  <div>Resistance</div>
  <div class="value" id="resistance">—</div>
</div>

<div class="stat">
  <div>Power</div>
  <div class="value" id="power">—</div>
</div>

<h2>Resistance Test</h2>

<div class="controls">
  <button id="minus" disabled>− RESISTANCE</button>
  <button id="plus" disabled>+ RESISTANCE</button>
</div>

<div class="log-title">
  <h2>Raw Data</h2>
  <button id="copy">COPY</button>
</div>

<pre id="log">Waiting...</pre>

<script>

const FTMS =
  "00001826-0000-1000-8000-00805f9b34fb";

const BIKE_DATA =
  "00002ad2-0000-1000-8000-00805f9b34fb";

const FEATURES =
  "00002acc-0000-1000-8000-00805f9b34fb";

const RESISTANCE_RANGE =
  "00002ad6-0000-1000-8000-00805f9b34fb";

const CONTROL_POINT =
  "00002ad9-0000-1000-8000-00805f9b34fb";

const statusEl =
  document.getElementById("status");

const logEl =
  document.getElementById("log");

const plusButton =
  document.getElementById("plus");

const minusButton =
  document.getElementById("minus");

let controlPoint = null;

let currentResistance = null;

function log(text) {
  logEl.textContent += text + "\n";
  logEl.scrollTop = logEl.scrollHeight;
  console.log(text);
}

function hex(data) {
  return [...new Uint8Array(data)]
    .map(x => x.toString(16).padStart(2, "0"))
    .join(" ");
}

function parseResistanceRange(buffer) {

  const data = new DataView(buffer);

  if (data.byteLength < 6) {
    return null;
  }

  return {
    minimum: data.getInt16(0, true) / 10,
    maximum: data.getInt16(2, true) / 10,
    increment: data.getUint16(4, true) / 10
  };
}

document.getElementById("copy").onclick = async () => {

  try {

    await navigator.clipboard.writeText(
      logEl.textContent
    );

    document.getElementById("copy").textContent =
      "COPIED!";

    setTimeout(() => {
      document.getElementById("copy").textContent =
        "COPY";
    }, 1500);

  } catch (error) {

    alert(
      "Couldn't copy automatically. You can select the text manually."
    );

  }
};

document.getElementById("connect").onclick =
async () => {

  try {

    logEl.textContent = "";

    statusEl.textContent =
      "Looking for bike...";

    const device =
      await navigator.bluetooth.requestDevice({
        filters: [{ services: [FTMS] }]
      });

    log("Device: " + device.name);

    statusEl.textContent =
      "Connecting...";

    const server =
      await device.gatt.connect();

    const service =
      await server.getPrimaryService(FTMS);

    statusEl.textContent =
      "Connected!";

    log("FTMS connected.");

    // -------------------------
    // BIKE DATA
    // -------------------------

    const bikeData =
      await service.getCharacteristic(
        BIKE_DATA
      );

    bikeData.addEventListener(
      "characteristicvaluechanged",
      event => {

        const data =
          event.target.value;

        const flags =
          data.getUint16(0, true);

        log(
          "Bike packet: " +
          hex(data.buffer)
        );

        let offset = 2;

        // Speed

        if (
          (flags & 0x0001) === 0 &&
          data.byteLength >= offset + 2
        ) {

          const speed =
            data.getUint16(offset, true) / 100;

          document.getElementById(
            "speed"
          ).textContent =
            speed.toFixed(1) + " km/h";

          offset += 2;
        }

        // Cadence

        if (flags & (1 << 2)) {

          const rpm =
            data.getUint16(offset, true) / 2;

          document.getElementById(
            "rpm"
          ).textContent =
            rpm.toFixed(1);

          offset += 2;
        }

        // Resistance

        if (flags & (1 << 5)) {

          currentResistance =
            data.getInt16(offset, true) / 10;

          document.getElementById(
            "resistance"
          ).textContent =
            currentResistance.toFixed(1);

          offset += 2;
        }

        // Power

        if (flags & (1 << 6)) {

          const power =
            data.getInt16(offset, true);

          document.getElementById(
            "power"
          ).textContent =
            power + " W";

          offset += 2;
        }

      }
    );

    await bikeData.startNotifications();

    log(
      "Listening for live bike data..."
    );

    // -------------------------
    // FEATURES
    // -------------------------

    try {

      const feature =
        await service.getCharacteristic(
          FEATURES
        );

      const value =
        await feature.readValue();

      log(
        "FEATURES: " +
        hex(value.buffer)
      );

    } catch (e) {

      log(
        "Could not read features: " +
        e.message
      );

    }

    // -------------------------
    // RESISTANCE RANGE
    // -------------------------

    try {

      const rangeCharacteristic =
        await service.getCharacteristic(
          RESISTANCE_RANGE
        );

      const value =
        await rangeCharacteristic.readValue();

      log(
        "RESISTANCE RANGE RAW: " +
        hex(value.buffer)
      );

      const range =
        parseResistanceRange(
          value.buffer
        );

      if (range) {

        log(
          "Minimum resistance: " +
          range.minimum
        );

        log(
          "Maximum resistance: " +
          range.maximum
        );

        log(
          "Resistance increment: " +
          range.increment
        );
      }

    } catch (e) {

      log(
        "Could not read resistance range: " +
        e.message
      );

    }

    // -------------------------
    // CONTROL POINT
    // -------------------------

    try {

      controlPoint =
        await service.getCharacteristic(
          CONTROL_POINT
        );

      log(
        "CONTROL POINT FOUND."
      );

      log(
        "Properties: " +
        JSON.stringify(
          controlPoint.properties
        )
      );

      plusButton.disabled = false;
      minusButton.disabled = false;

    } catch (e) {

      log(
        "CONTROL POINT ERROR: " +
        e.message
      );

    }

  } catch (error) {

    statusEl.textContent =
      "Error: " + error.message;

    log(
      error.name +
      ": " +
      error.message
    );

  }

};

// -------------------------
// RESISTANCE COMMAND
// -------------------------

async function requestResistanceChange(
  change
) {

  if (!controlPoint) {
    log(
      "Control point is not available."
    );
    return;
  }

  if (currentResistance === null) {

    log(
      "Waiting for current resistance..."
    );

    return;
  }

  const target =
    currentResistance + change;

  log(
    "REQUESTING RESISTANCE: " +
    currentResistance +
    " → " +
    target
  );

  /*
    FTMS Set Target Resistance Level

    Op Code:
    0x04

    Parameter:
    signed 16-bit resistance
    in 0.1 units
  */

  const value =
    new DataView(
      new ArrayBuffer(3)
    );

  value.setUint8(0, 0x04);

  value.setInt16(
    1,
    Math.round(target * 10),
    true
  );

  try {

    await controlPoint.writeValueWithResponse(
      value
    );

    log(
      "COMMAND SENT."
    );

  } catch (error) {

    log(
      "COMMAND FAILED: " +
      error.name +
      ": " +
      error.message
    );

  }

}

plusButton.onclick = () =>
  requestResistanceChange(1);

minusButton.onclick = () =>
  requestResistanceChange(-1);

</script>

</body>
</html>
