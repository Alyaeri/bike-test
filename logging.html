<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101010"><title>Bike Logging</title><style>*{box-sizing:border-box}body{margin:0;background:#101010;color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:14px}main{max-width:760px;margin:auto}.top{display:flex;align-items:center;gap:10px}.top a{color:#fff;text-decoration:none}.card{background:#202020;border-radius:16px;padding:16px;margin:12px 0}button{width:100%;min-height:58px;border:0;border-radius:14px;background:#eee;color:#111;font-size:18px;font-weight:800;margin:6px 0}.status{background:#292929;padding:12px;border-radius:10px;margin:10px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#292929;border-radius:10px;padding:10px}.label{font-size:11px;opacity:.55}.value{font-size:25px;font-weight:800}pre{background:#171717;border-radius:10px;padding:10px;max-height:420px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:11px}.small{font-size:13px;opacity:.7}</style></head><body><main><div class="top"><a href="index.html">← GAME</a><h1>Bike logging</h1></div><p class="small">Troubleshooting page. The game uses the same FTMS data underneath.</p><button id="connect">CONNECT TO BIKE</button><div id="status" class="status">Not connected</div><div class="card"><h2>LIVE DATA</h2><div class="stats"><div class="stat"><div class="label">CADENCE</div><div class="value" id="rpm">—</div></div><div class="stat"><div class="label">POWER</div><div class="value" id="power">—</div></div><div class="stat"><div class="label">SPEED</div><div class="value" id="speed">—</div></div><div class="stat"><div class="label">DISTANCE</div><div class="value" id="distance">—</div></div><div class="stat"><div class="label">RESISTANCE</div><div class="value" id="resistance">—</div></div><div class="stat"><div class="label">ELAPSED</div><div class="value" id="elapsed">00:00</div></div><div class="stat"><div class="label">ENERGY</div><div class="value" id="energy">—</div></div></div></div><div class="card"><h2>DIAGNOSTICS</h2><button id="copy">COPY DIAGNOSTICS</button><div id="copyStatus" class="status"></div><pre id="log">Waiting for connection...</pre></div></main><script>const FTMS='00001826-0000-1000-8000-00805f9b34fb',BIKE='00002ad2-0000-1000-8000-00805f9b34fb',RANGE='00002ad6-0000-1000-8000-00805f9b34fb';let logEl=document.getElementById('log'),t={rpm:0,power:0,speed:0,distance:0,resistance:null,elapsed:0,energy:null};function log(s){logEl.textContent+=s+'\n';logEl.scrollTop=logEl.scrollHeight}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function show(){rpm.textContent=t.rpm.toFixed(0);power.textContent=Math.round(t.power)+' W';speed.textContent=t.speed.toFixed(1)+' km/h';distance.textContent=t.distance<1000?Math.round(t.distance)+' m':(t.distance/1000).toFixed(2)+' km';resistance.textContent=t.resistance==null?'—':t.resistance.toFixed(1);elapsed.textContent=fmt(t.elapsed);energy.textContent=t.energy==null?'—':t.energy+' kcal'}function parse(d){const flags=d.getUint16(0,true);let i=2;if(!(flags&1)){t.speed=d.getUint16(i,true)/100;i+=2}if(flags&2)i+=2;if(flags&4){t.rpm=d.getUint16(i,true)*.5;i+=2}if(flags&8)i+=2;if(flags&16){t.distance=d.getUintLE(i,3);i+=3}if(flags&32){t.resistance=d.getInt16(i,true)/10;i+=2}if(flags&64){t.power=d.getInt16(i,true);i+=2}if(flags&128)i+=2;if(flags&256){t.energy=d.getUint16(i,true);i+=5}if(flags&512)i+=1;if(flags&1024)i+=1;if(flags&2048){t.elapsed=d.getUint16(i,true);i+=2}if(flags&4096){i+=2}show();log('BIKE: '+Array.from(new Uint8Array(d.buffer,d.byteOffset,d.byteLength)).map(x=>x.toString(16).padStart(2,'0')).join(' '))}async function connect(){try{if(!navigator.bluetooth)throw Error('Web Bluetooth is unavailable. Use Chrome on Android.');const dev=await navigator.bluetooth.requestDevice({filters:[{name:'FS-72812E'},{namePrefix:'FS-'}],optionalServices:[FTMS]});const server=await dev.gatt.connect(),svc=await server.getPrimaryService(FTMS),c=await svc.getCharacteristic(BIKE);await c.startNotifications();c.addEventListener('characteristicvaluechanged',e=>parse(e.target.value));status.textContent='FTMS connected: '+dev.name;log('Device: '+dev.name);log('FTMS connected.');const r=await svc.getCharacteristic(RANGE),rv=await r.readValue();log('RESISTANCE RANGE RAW: '+Array.from(new Uint8Array(rv.buffer,rv.byteOffset,rv.byteLength)).map(x=>x.toString(16).padStart(2,'0')).join(' '));log('Resistance range: '+rv.getInt16(0,true)/10+' → '+rv.getInt16(2,true)/10+' ('+rv.getInt16(4,true)/10+' increments)');log('Elapsed time is decoded from FTMS bit 11 (0x0800).')}catch(e){status.textContent='Connection error: '+e.message;log('ERROR: '+e.name+': '+e.message)}}connect.onclick=connect;copy.onclick=async()=>{try{await navigator.clipboard.writeText(logEl.textContent);copyStatus.textContent='Copied ✓'}catch(e){copyStatus.textContent='Could not copy automatically; select the log manually.'}};</script></body></html>
